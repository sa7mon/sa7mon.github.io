name: Lint Link Post Frontmatter

# Validates the YAML frontmatter of content/links/*.md files added or modified in a PR, against .github/schemas/link-post.schema.json.
# Catches malformed frontmatter like bad tag lists, wrong field types, etc.

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - "content/links/**.md"

jobs:
  lint-frontmatter:
    name: Validate frontmatter
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Find changed link posts
        id: changed
        run: |
          git diff --name-only --diff-filter=ACM \
            "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" \
            -- 'content/links/*.md' \
            | grep -v '^content/links/_index\.md$' > changed_link_files.txt || true

          if [ -s changed_link_files.txt ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.changed.outputs.has_changes == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        if: steps.changed.outputs.has_changes == 'true'
        run: pip install pyyaml jsonschema

      - name: Validate frontmatter
        if: steps.changed.outputs.has_changes == 'true'
        run: |
          mapfile -t files < changed_link_files.txt
          python .github/scripts/validate_link_frontmatter.py "${files[@]}"
